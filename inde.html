<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Message</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at top,#24003a,#000);
font-family:'Poppins',sans-serif;
color:white;
text-align:center;
overflow:hidden;
padding:20px;
}

#container{
max-width:700px;
width:100%;
z-index:10;
}

#title{
font-family:'Great Vibes',cursive;
font-size:55px;
margin-bottom:5px;
}

#age{
font-size:22px;
color:#caa6ff;
}

button{
margin-top:20px;
padding:14px 35px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
background:#8a2cff;
color:white;
}

#songBtn{
background:#ff4fd8;
margin-left:10px;
}

#gem{
display:none;
font-size:110px;
margin-top:30px;
cursor:pointer;
animation:floatGem 3s ease-in-out infinite;
}

@keyframes floatGem{
0%{transform:translateY(0)}
50%{transform:translateY(-15px)}
100%{transform:translateY(0)}
}

#message{
margin-top:30px;
font-size:22px;
line-height:1.8;
min-height:200px;
}

.love{
font-family:'Dancing Script',cursive;
font-size:40px;
color:#ff4fd8;
text-shadow:0 0 10px #ff4fd8,0 0 25px #ff4fd8;
}

.signature{
margin-top:15px;
color:#caa6ff;
}

.heart{
position:absolute;
bottom:-20px;
font-size:18px;
animation:rise 7s linear infinite;
}

@keyframes rise{
0%{transform:translateY(0);opacity:1}
100%{transform:translateY(-120vh);opacity:0}
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
z-index:0;
}

@media (max-width:600px){

#title{font-size:40px;}
#gem{font-size:85px;}
#message{font-size:18px;}
.love{font-size:32px;}

}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div id="container">

<h1 id="title">Happy Birthday Zarah Joanna</h1>
<div id="age">You are 21 now</div>

<button onclick="startExperience()">Open Message</button>
<button id="songBtn" onclick="playSong()">🎵 Play Your Favourite Song</button>

<div id="gem" onclick="showMessage()">💎</div>

<div id="message"></div>

</div>

<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<script>

/* SONG */

function playSong(){
document.getElementById("music").play();
}

/* OPEN */

function startExperience(){
document.getElementById("gem").style.display="block";
}

/* MESSAGE */

const lines = [

"<b>Happy birthday, my love.</b>",

"On this special day, I wish you endless joy, laughter, and all the love in the world.",

"May this year be filled with unforgettable moments and cherished memories together.",

"Here is to another year of growing, loving, and creating beautiful memories with you.",

"I adore you more than words can express.",

"Cheers to you, my love.",

"<span class='love'>I love you very much</span>",

"You are beautiful.",

"My precious gem 💎",

"May God bless you with joy, happiness, and good health.",

"I will always be with you in every situation, even during the hard times.",

"<span class='signature'>— Ben Joshua 💜</span>"

];

let index = 0;

function showMessage(){

document.getElementById("gem").style.display="none";

hearts();
fireworks();

typeLine();

}

function typeLine(){

if(index < lines.length){

let div=document.createElement("div");

div.innerHTML=lines[index];

document.getElementById("message").appendChild(div);

index++;

setTimeout(typeLine,1600);

}

}

/* HEARTS */

function hearts(){

setInterval(()=>{

let h=document.createElement("div");

h.className="heart";
h.innerHTML="💜";
h.style.left=Math.random()*100+"%";

document.body.appendChild(h);

setTimeout(()=>h.remove(),7000);

},1200);

}

/* FIREWORKS */

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function fireworks(){

setInterval(()=>{

let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;

for(let i=0;i<40;i++){

particles.push({
x:x,
y:y,
dx:(Math.random()-0.5)*6,
dy:(Math.random()-0.5)*6,
life:80
});

}

},1200);

animate();

}

function animate(){

requestAnimationFrame(animate);

ctx.fillStyle="rgba(0,0,0,0.2)";
ctx.fillRect(0,0,canvas.width,canvas.height);

particles.forEach((p,i)=>{

p.x+=p.dx;
p.y+=p.dy;
p.life--;

ctx.fillStyle="white";
ctx.fillRect(p.x,p.y,3,3);

if(p.life<=0)particles.splice(i,1);

});

}

</script>

</body>
</html>
